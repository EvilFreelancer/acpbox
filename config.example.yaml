# Example acpbox config. Copy to config.yaml and adjust.
# Every option can be overridden via environment variables (see .env.example).
# ACP uses stdio (one agent process per request); no HTTP to the agent.

acp:
  command:
    - opencode
    - acp
  env: {}
  workspace: "./workspace"

gateway:
  host: "0.0.0.0"
  port: 8080
  workers: 1
  threads: 1
  # Optional JSONL file path for raw HTTP requests/responses and raw ACP JSON-RPC traffic (including tool calls).
  # request_log_file: "./logs/acpbox-traffic.jsonl"
